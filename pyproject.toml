[project]
name = "catalog-watch"
version = "0.1.0"
description = "Scrape a product catalogue on a schedule and report what changed since the last run."
requires-python = ">=3.12"
dependencies = [
    # HTML parsing with CSS selectors, on the stdlib html.parser backend so
    # there is no lxml wheel and no C toolchain to install.
    "beautifulsoup4==4.12.3",
    # Writes the .xlsx the client actually opens. Pure Python.
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
]
# Only needed to regenerate demo/out/. Kept out of the default install so
# `make run` does not pull a browser down for a job that does not need one.
demo = [
    "playwright==1.47.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["catalog_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
